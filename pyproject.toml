[project]
name = "adventureworks-dbt"
version = "0.1.0"
description = "dbt project on the AdventureWorks data warehouse: star schema, SCD2, incremental fact, tests and a MetricFlow semantic layer, on DuckDB and Snowflake"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.10.23",
    "dbt-duckdb==1.10.1",
    "dbt-snowflake==1.10.8",
    "dbt-metricflow[dbt-duckdb]==0.13.0",
    "duckdb==2.0.0",
]

[dependency-groups]
lint = [
    "sqlfluff==4.5.0",
    "sqlfluff-templater-dbt==4.5.0",
]
extract = [
    "mssql-python==1.17.0",
    "pyarrow==26.0.1",
]

[tool.uv]
package = false
default-groups = ["lint"]
